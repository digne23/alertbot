<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AlertBot">
  <!-- Esicia brand mark: blue tile, gold bell, white signal arcs.
       Blue #0F5C92 and gold #CCAE3A match the Android app exactly. -->
  <rect width="512" height="512" rx="112" fill="#0F5C92"/>

  <!-- alarm bell -->
  <path d="M256 92c-61 0-110 49-110 110v82l-30 46c-6 9 1 21 12 21h256c11 0 18-12 12-21l-30-46v-82c0-61-49-110-110-110z"
        fill="#CCAE3A"/>
  <rect x="236" y="60" width="40" height="40" rx="20" fill="#CCAE3A"/>
  <path d="M212 372h88c0 24-20 44-44 44s-44-20-44-44z" fill="#CCAE3A"/>

  <!-- signal arcs -->
  <g stroke="#FFFFFF" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M104 214a112 112 0 0 1 34-80"/>
    <path d="M408 214a112 112 0 0 0-34-80"/>
  </g>
</svg>
