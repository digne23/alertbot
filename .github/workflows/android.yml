name: Build Android APK

# Your PC cannot run Android Studio, so the APK is built here instead.
# Run it from the Actions tab, then download the artifact and install it on
# the phone (Settings → allow install from unknown sources).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # There is no gradle wrapper in android/, so pin the version here rather
      # than relying on whatever the runner image happens to ship. AGP 8.7.3
      # needs Gradle 8.9 or newer.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # google-services.json is committed, but a repository secret overrides it
      # if you would rather keep it out of the repo.
      #
      # The secret goes through env: the `secrets` context is not available in a
      # step-level `if`, and referencing it there fails the whole workflow at
      # startup ("Unrecognized named-value: 'secrets'") before any job runs.
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alertbot-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
