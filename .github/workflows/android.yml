name: Build Android APK

# Your PC cannot run Android Studio, so the APK is built here instead.
# Run it from the Actions tab, then download the artifact and install it on
# the phone (Settings → allow install from unknown sources).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is committed, but a repository secret overrides it
      # if you would rather keep it out of the repo.
      - name: Write google-services.json from secret
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alertbot-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
